name: check

# 型・規約・面白さゲート・ビルドを通す。
# ゲートは前回の記録（docs/records/gate/）と見比べるので、
# 共通ランタイムを触って既存ゲームの手触りが変わった場合もここで気づける。
# 規約は eslint.config.mjs で、ゲームの絶対ルール（乱数・時刻・生の #hex 等）まで見ている。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: 規約（ゲームの絶対ルールを含む）
        run: npm run lint

      - name: 文書のリンク切れ
        run: npm run links

      - name: ランタイムの自己検査（機種・操作・リプレイの配管）
        run: npm run selftest

      - name: 面白さゲート（記録との比較つき）
        run: npm run fun:all

      - name: ビルド
        run: npm run build
