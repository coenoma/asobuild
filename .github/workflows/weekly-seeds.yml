name: weekly-seeds

# 種をずらして面白さゲートを回す。
#
# ふだんのゲートは固定の種で測っているので、
# 「たまたま今の種でうまくいっているだけ」の調整に気づけない。
# 週に一度、別の種で測り直して、まぐれでないことを確かめる。
#
# 記録との比較はしない（種が違えば数字がぶれて当然なので）。

on:
  schedule:
    - cron: '0 0 * * 1' # 毎週月曜 09:00 JST
  workflow_dispatch:

jobs:
  seeds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        offset: [31337, 424242, 987654]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 面白さゲート（種 ${{ matrix.offset }}）
        run: npm run fun:all -- --seed-offset=${{ matrix.offset }}
